<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>다빈치 코드 3D 프로토타입 (2~6인)</title>
<style>
  :root {
    --bg: #120d0a; --panel: rgba(24, 17, 12, .88); --line: rgba(255, 220, 150, .22);
    --gold: #f1c40f; --text: #f4ead6; --muted: #b9a98d; --ok: #2ecc71; --bad: #e74c3c; --blue: #4aa3ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hidden { display: none !important; }

  /* 상단: 플레이어 목록 */
  #players { position: fixed; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 4px; max-width: 46vw; z-index: 5; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 5px 9px; font-size: 12px;
    display: flex; align-items: center; gap: 6px; backdrop-filter: blur(4px); }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.turn { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 12px rgba(241, 196, 15, .35); }
  .chip.dead { opacity: .45; text-decoration: line-through; }
  .chip .cnt { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip .team { font-weight: 700; }

  /* 로그 */
  #log { position: fixed; top: 8px; right: 8px; width: min(300px, 44vw); max-height: 34vh; overflow: hidden; z-index: 5;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; font-size: 11.5px;
    line-height: 1.5; color: var(--muted); backdrop-filter: blur(4px); }
  #log div { padding: 1px 0; }
  #log div:last-child { color: var(--text); }
  #log b { color: var(--gold); }

  /* 하단 */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; }
  #status { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 13.5px;
    font-weight: 600; max-width: 94vw; text-align: center; backdrop-filter: blur(4px); pointer-events: auto; }
  #actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; pointer-events: auto; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); color: var(--text); background: #2b1f16; border-radius: 10px; padding: 9px 14px; font-weight: 700; }
  button:hover:not(:disabled) { filter: brightness(1.25); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: linear-gradient(180deg, #f1c40f, #c9a008); color: #1d1405; border-color: #f1c40f; }
  button.draw-b { background: #111; color: #fff; border-color: #888; }
  button.draw-w { background: #f3efe4; color: #111; border-color: #fff; }

  /* 모달 */
  .overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .62); padding: 14px; }
  .card { background: #1e1610; border: 1px solid var(--line); border-radius: 16px; padding: 20px; width: min(430px, 100%); max-height: 94vh; overflow: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, .6); }
  .card h1 { margin: 0 0 4px; font-size: 20px; }
  .card h2 { margin: 0 0 4px; font-size: 17px; }
  .card p.sub { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .row { margin: 12px 0; }
  .row > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1 1 0; min-width: 44px; padding: 9px 4px; }
  .seg button.on { background: var(--gold); color: #1d1405; border-color: var(--gold); }
  @media (max-width: 640px) {
    #log { width: 54vw; font-size: 10.5px; max-height: none; top: 8px; }
    #log div:not(:nth-last-child(-n+3)) { display: none; }
    #hint { display: none; }
    #players { max-width: 38vw; }
  }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin: 12px 0; }
  .grid button { padding: 13px 0; font-size: 18px; }
  .grid button.imp { opacity: .3; }
  .grid button.joker { grid-column: span 4; font-size: 14px; }
  #toast { position: fixed; top: 18%; left: 50%; transform: translateX(-50%); z-index: 30; background: rgba(120, 25, 20, .95); color: #fff;
    padding: 10px 18px; border-radius: 12px; font-size: 13.5px; font-weight: 600; max-width: 90vw; text-align: center; pointer-events: none;
    opacity: 0; transition: opacity .2s; }
  #toast.show { opacity: 1; }
  #toast.good { background: rgba(20, 100, 55, .95); }
  #hint { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 4; font-size: 11px; color: var(--muted); pointer-events: none; white-space: nowrap; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 50; background: var(--bg); color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading">3D 엔진 불러오는 중…</div>

<div id="players"></div>
<div id="log"></div>
<div id="hint">드래그: 시점 회전 · 휠/핀치: 확대 · 상대 타일 클릭: 추리</div>

<div id="bottom">
  <div id="status">-</div>
  <div id="actions">
    <button id="btn-draw-b" class="draw-b">검은 타일 뽑기 (<span id="cnt-b">0</span>)</button>
    <button id="btn-draw-w" class="draw-w">흰 타일 뽑기 (<span id="cnt-w">0</span>)</button>
    <button id="btn-pass">턴 넘기기</button>
    <button id="btn-menu">설정 / 새 게임</button>
  </div>
</div>

<!-- 설정 -->
<div id="setup" class="overlay">
  <div class="card">
    <h1>다빈치 코드 3D</h1>
    <p class="sub">프로토타입 · 2~6인 개인전 / 4인 팀전 · 나(1번 자리)를 제외한 나머지는 AI가 플레이합니다. 실제 사이트 적용 전 확인용 샘플입니다.</p>
    <div class="row"><label>인원 수</label>
      <div class="seg" id="seg-n"></div></div>
    <div class="row"><label>게임 모드</label>
      <div class="seg" id="seg-mode">
        <button data-v="ffa" class="on">개인전</button>
        <button data-v="team">2:2 팀전 (4인)</button>
      </div></div>
    <div class="row"><label>시작 타일 수</label>
      <div class="seg" id="seg-start"></div></div>
    <div class="row"><label class="check"><input type="checkbox" id="chk-demo"> 데모 모드 (내 차례도 AI가 자동 진행)</label></div>
    <button class="primary" id="btn-start" style="width:100%;padding:13px;font-size:15px;">게임 시작</button>
  </div>
</div>

<!-- 추리 -->
<div id="guess" class="overlay hidden">
  <div class="card">
    <h2 id="guess-title">추리</h2>
    <p class="sub" id="guess-sub"></p>
    <div class="grid" id="guess-grid"></div>
    <button id="guess-cancel" style="width:100%">취소</button>
  </div>
</div>

<!-- 종료 -->
<div id="over" class="overlay hidden">
  <div class="card" style="text-align:center">
    <h2 id="over-title" style="font-size:22px"></h2>
    <p class="sub" id="over-sub"></p>
    <button class="primary" id="btn-again" style="width:100%;padding:12px">다시 하기</button>
    <button id="btn-view" style="width:100%;margin-top:8px">테이블 둘러보기</button>
  </div>
</div>
<div id="toast"></div>

<!-- ============================================================
     게임 엔진 (렌더링과 완전히 분리된 순수 로직 · 시뮬레이션 테스트 대상)
     ============================================================ -->
<script id="engine">
const DVC = (function () {
  'use strict';

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }
  const label = n => (n === -1 ? '-' : String(n));
  const isDead = p => p.hand.length > 0 && p.hand.every(t => t.revealed);

  // 숫자(조커 제외)는 왼쪽이 작고, 같은 숫자면 검은색이 왼쪽. 조커는 어디든 가능.
  function validInsert(hand, tile, idx) {
    const t = hand.slice();
    t.splice(idx, 0, tile);
    const nj = t.filter(x => x.num !== -1);
    for (let i = 0; i < nj.length - 1; i++) {
      const a = nj[i], b = nj[i + 1];
      if (a.num > b.num) return false;
      if (a.num === b.num && a.color === 'white' && b.color === 'black') return false;
    }
    return true;
  }
  function validPositions(hand, tile) {
    const r = [];
    for (let i = 0; i <= hand.length; i++) if (validInsert(hand, tile, i)) r.push(i);
    return r;
  }

  function create(n, opts) {
    opts = opts || {};
    if (!(n >= 2 && n <= 6)) throw new Error('인원은 2~6명이어야 합니다');
    const rng = opts.rng || Math.random;
    const mode = (opts.mode === 'team' && n === 4) ? 'team' : 'ffa';
    const black = [], white = [];
    for (let i = 0; i <= 11; i++) {
      black.push({ id: 'b' + i, color: 'black', num: i, revealed: false });
      white.push({ id: 'w' + i, color: 'white', num: i, revealed: false });
    }
    black.push({ id: 'bJ', color: 'black', num: -1, revealed: false });
    white.push({ id: 'wJ', color: 'white', num: -1, revealed: false });
    shuffle(black, rng); shuffle(white, rng);

    let start = (opts.tileSetting && opts.tileSetting !== 'auto') ? Number(opts.tileSetting) : (n >= 5 ? 3 : 4);
    start = Math.max(1, Math.min(start, Math.floor(26 / n))); // 타일이 모자라지 않도록

    const humans = opts.humans || [0];
    const players = [];
    for (let k = 0; k < n; k++) {
      const pool = [];
      for (let i = 0; i < start; i++) {
        const pick = (black.length > 0 && rng() < 0.5) ? black : (white.length > 0 ? white : black);
        pool.push(pick.pop());
      }
      const first = pool.shift();
      players.push({
        id: k,
        name: (opts.names && opts.names[k]) || (k === 0 ? '나' : 'AI ' + k),
        team: mode === 'team' ? (k % 2 === 0 ? 'A' : 'B') : null,
        bot: humans.indexOf(k) < 0,
        hand: [first], pool: pool,
        stats: { correct: 0, wrong: 0, streak: 0, best: 0 }
      });
    }
    const s = {
      n: n, mode: mode, start: start, players: players, black: black, white: white,
      turn: 0, turnCount: 1, phase: 'initial', drawn: null, drawnId: null, guessedOk: false,
      winners: null, log: [], seq: 0
    };
    addLog(s, '게임 시작! 각자 처음 받은 타일을 원하는 위치에 배치하세요.');
    if (players.every(p => p.pool.length === 0)) beginTurn(s);
    return s;
  }

  function addLog(s, msg) { s.seq++; s.log.push(msg); if (s.log.length > 200) s.log.shift(); }

  function beginTurn(s) {
    let guard = 0;
    while (isDead(s.players[s.turn]) && guard++ < s.n) s.turn = (s.turn + 1) % s.n;
    s.drawn = null; s.drawnId = null; s.guessedOk = false;
    s.phase = (s.black.length + s.white.length === 0) ? 'guess' : 'draw';
  }
  function advance(s) {
    s.turn = (s.turn + 1) % s.n;
    s.turnCount++;
    beginTurn(s);
  }

  function checkWinner(s) {
    const alive = s.players.filter(p => !isDead(p));
    if (s.mode === 'team') {
      const a = alive.some(p => p.team === 'A'), b = alive.some(p => p.team === 'B');
      if (a && !b) return finish(s, s.players.filter(p => p.team === 'A').map(p => p.id), '팀 A');
      if (!a && b) return finish(s, s.players.filter(p => p.team === 'B').map(p => p.id), '팀 B');
    } else if (alive.length === 1) {
      return finish(s, [alive[0].id], alive[0].name);
    }
    return false;
  }
  function finish(s, ids, name) {
    s.phase = 'over'; s.winners = ids; s.winnerName = name;
    addLog(s, '게임 종료! 승리: ' + name);
    return true;
  }

  const err = m => ({ ok: false, err: m });

  function placeInitial(s, pid, idx) {
    if (s.phase !== 'initial') return err('지금은 초기 배치 단계가 아닙니다');
    const p = s.players[pid];
    if (!p || p.pool.length === 0) return err('배치할 타일이 없습니다');
    const tile = p.pool[0];
    if (!validInsert(p.hand, tile, idx)) return err('배치 오류! 숫자는 왼쪽이 작고 오른쪽이 커야 하며, 같은 숫자는 검은색이 왼쪽입니다.');
    p.hand.splice(idx, 0, tile);
    p.pool.shift();
    if (s.players.every(q => q.pool.length === 0)) {
      addLog(s, '모든 플레이어가 배치를 마쳤습니다. ' + s.players[0].name + ' 님부터 시작!');
      beginTurn(s);
    }
    return { ok: true };
  }

  function draw(s, pid, color) {
    if (s.phase !== 'draw') return err('지금은 타일을 뽑을 수 없습니다');
    if (pid !== s.turn) return err('내 차례가 아닙니다');
    const deck = color === 'black' ? s.black : s.white;
    if (deck.length === 0) return err((color === 'black' ? '검은색' : '흰색') + ' 덱에 남은 타일이 없습니다');
    s.drawn = deck.pop();
    s.drawnId = s.drawn.id;
    s.phase = 'place';
    addLog(s, s.players[pid].name + ' 님이 ' + (color === 'black' ? '검은색' : '흰색') + ' 타일을 뽑았습니다.');
    return { ok: true, tile: s.drawn };
  }

  function place(s, pid, idx) {
    if (s.phase !== 'place') return err('지금은 타일을 배치할 수 없습니다');
    if (pid !== s.turn) return err('내 차례가 아닙니다');
    const p = s.players[pid];
    if (!validInsert(p.hand, s.drawn, idx)) return err('배치 오류! 숫자는 왼쪽이 작고 오른쪽이 커야 하며, 같은 숫자는 검은색이 왼쪽입니다.');
    p.hand.splice(idx, 0, s.drawn);
    s.drawn = null;
    s.phase = 'guess';
    return { ok: true };
  }

  function guess(s, pid, targetId, idx, num) {
    if (s.phase !== 'guess') return err('지금은 추리할 수 없습니다');
    if (pid !== s.turn) return err('내 차례가 아닙니다');
    const me = s.players[pid], tg = s.players[targetId];
    if (!tg || targetId === pid) return err('상대 플레이어를 선택하세요');
    if (s.mode === 'team' && tg.team === me.team) return err('같은 팀 타일은 추리할 수 없습니다');
    if (isDead(tg)) return err('이미 탈락한 플레이어입니다');
    const tile = tg.hand[idx];
    if (!tile || tile.revealed) return err('이미 공개된 타일입니다');
    if (!Number.isInteger(num) || num < -1 || num > 11) return err('0~11 또는 조커(-)만 입력할 수 있습니다');

    const shown = label(num);
    if (num === tile.num) {
      tile.revealed = true;
      s.guessedOk = true;
      me.stats.correct++; me.stats.streak++; me.stats.best = Math.max(me.stats.best, me.stats.streak);
      addLog(s, me.name + ' → ' + tg.name + '의 ' + (idx + 1) + '번째 [' + shown + '] : 정답!');
      checkWinner(s);
      return { ok: true, correct: true, tile: tile };
    }
    // 오답: 방금 뽑은 타일(없으면 가장 오른쪽 비공개 타일)을 공개하고 턴 종료
    let rev = s.drawnId ? me.hand.find(t => t.id === s.drawnId) : null;
    if (!rev || rev.revealed) {
      rev = null;
      for (let i = me.hand.length - 1; i >= 0; i--) if (!me.hand[i].revealed) { rev = me.hand[i]; break; }
    }
    if (rev) rev.revealed = true;
    me.stats.wrong++; me.stats.streak = 0;
    addLog(s, me.name + ' → ' + tg.name + '의 ' + (idx + 1) + '번째 [' + shown + '] : 오답! 내 타일 공개, 턴 종료');
    if (!checkWinner(s)) advance(s);
    return { ok: true, correct: false, revealed: rev };
  }

  function pass(s, pid) {
    if (s.phase !== 'guess') return err('지금은 턴을 넘길 수 없습니다');
    if (pid !== s.turn) return err('내 차례가 아닙니다');
    if (!s.guessedOk) return err('최소 1번은 상대 타일을 맞혀야 턴을 넘길 수 있습니다');
    addLog(s, s.players[pid].name + ' 님이 턴을 종료했습니다.');
    advance(s);
    return { ok: true };
  }

  /* ---------- 추리 보조 / AI ---------- */
  function visibleSet(s, viewer) {
    const set = new Set();
    const me = s.players[viewer];
    s.players.forEach(p => {
      const mate = s.mode === 'team' && p.team === me.team;
      p.hand.forEach(t => { if (p.id === viewer || mate || t.revealed) set.add(t.color + t.num); });
    });
    if (s.drawn && s.turn === viewer) set.add(s.drawn.color + s.drawn.num);
    return set;
  }
  // viewer 입장에서 target의 idx번째 타일이 될 수 있는 값(조커=-1 포함)
  function candidates(s, viewer, targetId, idx) {
    const tg = s.players[targetId], tile = tg.hand[idx];
    const known = visibleSet(s, viewer);
    let L = null, R = null;
    for (let i = idx - 1; i >= 0; i--) { const t = tg.hand[i]; if (t.revealed && t.num !== -1) { L = t; break; } }
    for (let i = idx + 1; i < tg.hand.length; i++) { const t = tg.hand[i]; if (t.revealed && t.num !== -1) { R = t; break; } }
    const c = tile.color, out = [];
    for (let v = -1; v <= 11; v++) {
      if (known.has(c + v)) continue;
      if (v !== -1) {
        if (L && !(L.num < v || (L.num === v && L.color === 'black' && c === 'white'))) continue;
        if (R && !(v < R.num || (v === R.num && c === 'black' && R.color === 'white'))) continue;
      }
      out.push(v);
    }
    return out;
  }

  function aiStep(s, pid, rng) {
    rng = rng || Math.random;
    const p = s.players[pid];
    if (s.phase === 'initial') {
      if (p.pool.length === 0) return err('대기');
      const pos = validPositions(p.hand, p.pool[0]);
      return placeInitial(s, pid, pos[Math.floor(rng() * pos.length)]);
    }
    if (pid !== s.turn) return err('내 차례가 아님');
    if (s.phase === 'draw') {
      const opts = [];
      if (s.black.length) opts.push('black');
      if (s.white.length) opts.push('white');
      return draw(s, pid, opts[Math.floor(rng() * opts.length)]);
    }
    if (s.phase === 'place') {
      const pos = validPositions(p.hand, s.drawn);
      return place(s, pid, pos[Math.floor(rng() * pos.length)]);
    }
    if (s.phase === 'guess') {
      let best = null, bestN = 99;
      s.players.forEach(t => {
        if (t.id === pid || isDead(t)) return;
        if (s.mode === 'team' && t.team === p.team) return;
        t.hand.forEach((tile, i) => {
          if (tile.revealed) return;
          const c = candidates(s, pid, t.id, i);
          if (c.length === 0) return;
          const score = c.length + rng() * 0.5;
          if (score < bestN) { bestN = score; best = { t: t.id, i: i, c: c }; }
        });
      });
      const prob = best ? 1 / best.c.length : 0;

  $('guess-title').textContent = loc.p.name + ' 님의 ' + (loc.i + 1) + '번째 ' + (loc.tile.color === 'black' ? '검은' : '흰') + ' 타일';
  $('guess-sub').textContent = '숫자를 맞혀보세요. 흐린 숫자는 이미 내 눈에 보이거나 순서상 불가능한 값입니다.';
  const cands = new Set(DVC.candidates(G, VIEW, loc.p.id, loc.i));
  const grid = $('guess-grid'); grid.innerHTML = '';
  for (let v = 0; v <= 11; v++) {
    const b = document.createElement('button');
    b.textContent = v; if (!cands.has(v)) b.className = 'imp';
    b.onclick = () => submitGuess(v);
    grid.appendChild(b);
  }
  const j = document.createElement('button');
  j.className = 'joker' + (cands.has(-1) ? '' : ' imp'); j.textContent = '조커 ( - )';
  j.onclick = () => submitGuess(-1);
  grid.appendChild(j);
  $('guess').classList.remove('hidden');
  sync();
}
function closeGuess() { ui.guessing = false; ui.selected = null; $('guess').classList.add('hidden'); sync(); }
function submitGuess(v) {
  const loc = locate(ui.selected);
  const tid = loc.p.id, idx = loc.i;
  closeGuess();
  const r = DVC.guess(G, VIEW, tid, idx, v);
  if (!r.ok) return toast(r.err);
  toast(r.correct ? '정답! 계속 추리하거나 턴을 넘기세요' : '틀렸습니다! 내 타일이 공개되고 턴이 넘어갑니다', r.correct);
  sync(); scheduleNext();
}

/* 봇 진행 */
function scheduleNext() {
  clearTimeout(botTimer);
  if (!G || G.phase === 'over') return;
  if (G.phase === 'initial') {
    // 봇은 즉시 초기 배치
    G.players.forEach(p => { while (p.bot && p.pool.length && G.phase === 'initial') DVC.aiStep(G, p.id); });
    sync();
    if (G.phase === 'initial') return;
  }
  const p = G.players[G.turn];
  if (p.bot) {
    botTimer = setTimeout(() => {
      if (!G || G.phase === 'over') return;
      const r = DVC.aiStep(G, G.turn);
      if (!r.ok) console.warn('AI 오류', r.err);
      sync(); scheduleNext();
    }, BOT_DELAY);
  }
}

/* ---------------- 장면 동기화 ---------------- */
const Q = new THREE.Quaternion(), E = new THREE.Euler(), V3 = new THREE.Vector3();
function seatQuat(phi, rx) { E.set(rx || 0, phi, 0, 'YXZ'); return new THREE.Quaternion().setFromEuler(E); }
function seatPoint(k, x, y, z) {
  const phi = k * 2 * Math.PI / G.n;
  const out = new THREE.Vector3(Math.sin(phi), 0, Math.cos(phi));
  const right = new THREE.Vector3(Math.cos(phi), 0, -Math.sin(phi));
  return out.multiplyScalar(R.rr + z).add(right.multiplyScalar(x)).add(new THREE.Vector3(0, y, 0));
}

function faceKnowledge(ownerIdx, tile) {
  const over = G.phase === 'over', viewerDead = iAmDead();
  const owner = G.players[ownerIdx];
  const mate = G.mode === 'team' && owner.team === me().team && ownerIdx !== VIEW;
  const full = over || viewerDead || tile.revealed || mate;
  return { front: full || ownerIdx === VIEW, back: full };
}

let slotRebuildKey = '';
function sync() {
  if (!G) return;
  const placing = humanPlacing();
  const shown = new Set();

  // 손패 배치
  G.players.forEach((p, k) => {
    const len = p.hand.length;
    const gap = (k === VIEW && placing) ? 0.5 : 0;
    const s = Math.max(0.36, Math.min(1, R.avail / (len * SP + (len + 1) * gap + 0.01)));
    const step = (SP + gap) * s;
    const phi = k * 2 * Math.PI / G.n;
    p._layout = { s, step, len };
    p.hand.forEach((t, i) => {
      const o = getTileObj(t);
      shown.add(t.id);
      const x = (i - (len - 1) / 2) * step;
      const rev = t.revealed;
      const lean = rev ? 0.14 : 0;
      const y = R.rackY + 0.12 + (TILE_H * s / 2) * Math.cos(lean) + (rev ? 0.02 : 0);
      const pos = seatPoint(k, x, y, rev ? 0.12 * s : 0);
      o.tpos = pos; o.tquat = seatQuat(phi, lean); o.tscale = s;
      o.owner = k;
      const fk = faceKnowledge(k, t);
      const fkey = (fk.front ? 'n' : 'c'), bkey = (fk.back ? 'n' : 'c');
      if (o.fk !== fkey) { o.fk = fkey; setFace(o.front, fkey, t, !fk.front); }
      if (o.bk !== bkey) { o.bk = bkey; setFace(o.back, bkey, t, !fk.back); }
      o.revealed = rev;
      if (o.fresh) { // 처음 등장: 덱 위치에서 날아오기
        o.fresh = false;
        o.g.position.copy(deckPos(t.color)); o.g.quaternion.copy(o.tquat); o.g.scale.setScalar(s);
      }
      o.g.visible = true;
    });
  });

  // 뽑은 타일 / 시작 타일 (대기 중)
  let pend = null, pendOwner = -1;
  if (G.phase === 'place' && G.drawn) { pend = G.drawn; pendOwner = G.turn; }
  else if (G.phase === 'initial' && !G.players[VIEW].bot && G.players[VIEW].pool.length) { pend = G.players[VIEW].pool[0]; pendOwner = VIEW; }
  if (pend) {
    const o = getTileObj(pend);
    shown.add(pend.id);
    const isMine = pendOwner === VIEW;
    const phi = pendOwner * 2 * Math.PI / G.n;
    const pos = seatPoint(pendOwner, 0, isMine ? 1.9 : 2.2, -R.rr * (isMine ? 0.3 : 0.42));
    o.tpos = pos;
    o.tquat = isMine ? seatQuat(phi, -0.5) : seatQuat(phi + Math.PI, -0.35);
    o.tscale = isMine ? 1.25 : 1.1;
    o.owner = pendOwner;
    const showFront = isMine || G.phase === 'over';
    const fkey = showFront ? 'n' : 'c';
    if (isMine) {
      if (o.fk !== 'n') { o.fk = 'n'; setFace(o.front, 'n', pend, false); }
    } else {
      if (o.fk !== 'c') { o.fk = 'c'; setFace(o.front, 'c', pend, true); }
      if (o.bk !== 'c') { o.bk = 'c'; setFace(o.back, 'c', pend, true); }
    }
    o.revealed = false;
    if (o.fresh) { o.fresh = false; o.g.position.copy(deckPos(pend.color)); o.g.quaternion.copy(o.tquat); o.g.scale.setScalar(1); }
    o.g.visible = true;
  }
  Object.keys(tileObjs).forEach(id => { if (!shown.has(id)) tileObjs[id].g.visible = false; });

  updateDecks();
  updateSlots(placing);
  updateHud();
  if (G.phase === 'over') showGameOver();
}
function deckPos(color) { const d = deckObjs[color]; return new THREE.Vector3(d.x, 1.6, 0); }

function updateDecks() {
  ['black', 'white'].forEach(color => {
    const d = deckObjs[color], cnt = G[color].length;
    const h = Math.max(0.04, cnt * 0.11);
    d.mesh.scale.y = h; d.mesh.position.y = 0.4 + h / 2;
    d.mesh.visible = cnt > 0;
    d.label.sp.position.set(d.x, 0.4 + h + 0.85, 0);
    drawLabel(d.label, (color === 'black' ? '검은' : '흰') + ' ' + cnt, '', '#aaa', false);
    d.drawable = myTurn() && G.phase === 'draw' && cnt > 0;
  });
}

function updateSlots(placing) {
  slotMarks.forEach(s => { worldGroup.remove(s.mesh); tileGroup.remove(s.mesh); });
  slotMarks.length = 0;
  if (!placing) return;
  const tile = pendingTile(); if (!tile) return;
  const p = me(), L = p._layout;
  const valid = new Set(DVC.validPositions(p.hand, tile));
  for (let j = 0; j <= L.len; j++) {
    const x = (j - L.len / 2) * L.step;
    const ok = valid.has(j);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.42 * L.s + 0.1, 1.15 * L.s + 0.2),
      new THREE.MeshBasicMaterial({ color: ok ? 0x2ecc71 : 0x8a3a3a, transparent: true, opacity: ok ? 0.8 : 0.3, side: THREE.DoubleSide, depthWrite: false }));
    m.position.copy(seatPoint(VIEW, x, R.rackY + 0.14 + (TILE_H * L.s) / 2, 0.02));
    m.quaternion.copy(seatQuat(0, 0));
    m.userData = { type: 'slot', idx: j };
    tileGroup.add(m);
    slotMarks.push({ mesh: m, ok });
  }
}

function updateHud() {
  // 플레이어 칩
  const chips = $('players'); chips.innerHTML = '';
  G.players.forEach(p => {
    const hidden = p.hand.filter(t => !t.revealed).length;
    const d = document.createElement('div');
    d.className = 'chip' + (G.phase !== 'over' && G.phase !== 'initial' && G.turn === p.id ? ' turn' : '') + (DVC.isDead(p) ? ' dead' : '');
    const team = p.team ? '<span class="team" style="color:' + (p.team === 'A' ? '#4aa3ff' : '#ff6b5b') + '">' + p.team + '</span>' : '';
    d.innerHTML = '<span class="dot" style="background:' + SEAT_COLORS[p.id] + '"></span>' + team + '<span>' + p.name + '</span><span class="cnt">남은 ' + hidden + '/' + p.hand.length + '</span>';
    chips.appendChild(d);
  });
  // 로그
  const lg = $('log');
  lg.innerHTML = G.log.slice(-7).map(l => '<div>' + l.replace(/\[(.*?)\]/g, '<b>[$1]</b>') + '</div>').join('');

  // 좌석 라벨 + 차례 링
  G.players.forEach((p, k) => {
    const hidden = p.hand.filter(t => !t.revealed).length;
    const tm = p.team ? ' · 팀 ' + p.team : '';
    const turn = G.phase !== 'over' && G.phase !== 'initial' && G.turn === k;
    drawLabel(seatInfo[k], p.name + (DVC.isDead(p) ? ' (탈락)' : ''), '남은 타일 ' + hidden + '/' + p.hand.length + tm, SEAT_COLORS[k], turn);
  });
  const showRing = G.phase !== 'over' && G.phase !== 'initial';
  turnRing.visible = showRing;
  if (showRing) { turnRing.position.copy(seatPoint(G.turn, 0, 0.43, -1.1)); turnRing.rotation.z = G.turn * 2 * Math.PI / G.n; turnRing.scale.set(Math.max(2.2, R.avail * 0.42), 1, 0.9); }

  // 상태 + 버튼
  const st = $('status'); let msg = '', col = '';
  const pl = G.players[G.turn];
  const mt = myTurn(), dead = iAmDead();
  if (G.phase === 'over') { msg = '게임 종료 — ' + G.winnerName + ' 승리!'; col = '#2ecc71'; }
  else if (G.phase === 'initial') {
    msg = me().pool.length ? '시작 타일 배치 (남은 ' + (me().pool.length) + '장) — 초록색 [ + ] 위치를 눌러 놓으세요' : '다른 플레이어가 배치하는 중…';
    col = '#f1c40f';
  }
  else if (dead && !G.players[VIEW].bot) { msg = '내 모든 타일이 공개되어 탈락! 관전 중 — ' + pl.name + ' 님의 턴'; col = '#e74c3c'; }
  else if (mt && G.phase === 'draw') { msg = '내 차례 — 검은색/흰색 덱을 눌러 타일을 한 장 뽑으세요'; col = '#e67e22'; }
  else if (mt && G.phase === 'place') { msg = '뽑은 타일을 놓을 위치의 [ + ]를 누르세요'; col = '#f1c40f'; }
  else if (mt && G.phase === 'guess') {
    msg = G.guessedOk ? '정답! 계속 추리하거나 [턴 넘기기]를 누르세요' : '상대의 숨겨진 타일을 눌러 숫자를 추리하세요 (1번은 맞혀야 넘길 수 있음)';
    col = G.guessedOk ? '#2ecc71' : '#f1c40f';
  }
  else { msg = pl.name + ' 님의 턴 진행 중…' + (G.phase === 'place' ? ' (타일 배치)' : G.phase === 'guess' ? ' (추리)' : ''); col = '#f39c12'; }
  st.textContent = msg; st.style.color = col;

  $('cnt-b').textContent = G.black.length; $('cnt-w').textContent = G.white.length;
  $('btn-draw-b').disabled = !(mt && G.phase === 'draw' && G.black.length > 0);
  $('btn-draw-w').disabled = !(mt && G.phase === 'draw' && G.white.length > 0);
  $('btn-pass').disabled = !(mt && G.phase === 'guess' && G.guessedOk);
}

function showGameOver() {
  if (!$('over').classList.contains('hidden') || showGameOver.dismissed === G) return;
  const w = G.winners.indexOf(VIEW) >= 0;
  $('over-title').textContent = (w ? '🎉 승리! ' : '패배… ') + G.winnerName;
  $('over-sub').textContent = G.players.map(p => p.name + ' 정답 ' + p.stats.correct + ' / 오답 ' + p.stats.wrong).join('  ·  ') + '  (총 ' + G.turnCount + '턴)';
  setTimeout(() => { if (G && G.phase === 'over' && showGameOver.dismissed !== G) $('over').classList.remove('hidden'); }, 900);
}

/* ---------------- 애니메이션 루프 ---------------- */
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  const k = 1 - Math.exp(-dt * 9);
  updateCamera();
  if (G) {
    Object.keys(tileObjs).forEach(id => {
      const o = tileObjs[id];
      if (!o.g.visible || !o.tpos) return;
      const hover = ui.hoverId === id && (tileGuessable(id));
      const sel = ui.selected === id;
      V3.copy(o.tpos); if (hover || sel) V3.y += 0.32;
      o.g.position.lerp(V3, k);
      o.g.quaternion.slerp(o.tquat, k);
      o.g.scale.setScalar(o.g.scale.x + (o.tscale - o.g.scale.x) * k);
      const mat = o.body.material;
      const glow = sel ? 0x6b5200 : hover ? 0x3a3000 : (o.revealed ? 0x3a0f0f : 0x000000);
      mat.emissive.setHex(glow);
      mat.color.setHex(o.revealed ? (o.base === 0x1c1c21 ? 0x2a2022 : 0xd9c9c0) : o.base);
    });
    const t = now / 1000;
    ['black', 'white'].forEach(c => {
      const d = deckObjs[c];
      d.mesh.material.emissive.setHex(d.drawable ? (Math.sin(t * 5) > 0 ? 0x5a4500 : 0x2a2000) : 0x000000);
    });
    if (turnRing.visible) turnRing.material.color.setHex(Math.sin(t * 4) > 0 ? 0xf1c40f : 0xb08d0a);
    slotMarks.forEach((s, i) => { if (s.ok) s.mesh.material.opacity = 0.55 + 0.3 * Math.sin(t * 5 + i); });
  }
  renderer.render(scene, camera);
}

/* ---------------- 설정 / 시작 ---------------- */
function buildSetup() {
  const segN = $('seg-n'); segN.innerHTML = '';
  for (let n = 2; n <= 6; n++) {
    const b = document.createElement('button'); b.textContent = n + '인'; b.dataset.v = n;
    if (n === cfg.n) b.className = 'on';
    b.onclick = () => { cfg.n = n; if (n !== 4) cfg.mode = 'ffa'; refreshSetup(); };
    segN.appendChild(b);
  }
  [...$('seg-mode').children].forEach(b => b.onclick = () => {
    if (b.dataset.v === 'team' && cfg.n !== 4) { cfg.n = 4; }
    cfg.mode = b.dataset.v; refreshSetup();
  });
  refreshSetup();
}
function refreshSetup() {
  [...$('seg-n').children].forEach(b => b.className = Number(b.dataset.v) === cfg.n ? 'on' : '');
  [...$('seg-mode').children].forEach(b => b.className = b.dataset.v === cfg.mode ? 'on' : '');
  const seg = $('seg-start'); seg.innerHTML = '';
  const auto = cfg.n >= 5 ? 3 : 4;
  [['auto', '자동(' + auto + '장)'], ['3', '3장'], ['4', '4장'], ['5', '5장']].forEach(([v, t]) => {
    const b = document.createElement('button'); b.textContent = t; b.dataset.v = v;
    const bad = v !== 'auto' && Number(v) * cfg.n > 26;
    b.disabled = bad;
    if (cfg.start === v && !bad) b.className = 'on';
    b.onclick = () => { cfg.start = v; refreshSetup(); };
    seg.appendChild(b);
  });
  if (cfg.start !== 'auto' && Number(cfg.start) * cfg.n > 26) cfg.start = 'auto';
}
function startGame() {
  clearTimeout(botTimer);
  cfg.demo = $('chk-demo').checked;
  const names = ['나']; for (let i = 1; i < cfg.n; i++) names.push('AI ' + i);
  G = DVC.create(cfg.n, { mode: cfg.mode, tileSetting: cfg.start, names, humans: cfg.demo ? [] : [0], rng: URLP.has('seed') ? DVC.mulberry32(Number(URLP.get('seed'))) : Math.random });
  Object.keys(tileObjs).forEach(id => { tileGroup.remove(tileObjs[id].g); delete tileObjs[id]; });
  slotMarks.length = 0;
  buildWorld(cfg.n);
  ui = { hoverId: null, selected: null, guessing: false };
  showGameOver.dismissed = null;
  $('over').classList.add('hidden'); $('setup').classList.add('hidden'); $('guess').classList.add('hidden');
  sync(); scheduleNext();
}

$('btn-start').onclick = startGame;
$('btn-again').onclick = () => { $('over').classList.add('hidden'); startGame(); };
$('btn-view').onclick = () => { showGameOver.dismissed = G; $('over').classList.add('hidden'); };
$('btn-menu').onclick = () => { $('setup').classList.remove('hidden'); };
$('btn-draw-b').onclick = () => doDraw('black');
$('btn-draw-w').onclick = () => doDraw('white');
$('btn-pass').onclick = doPass;
$('guess-cancel').onclick = closeGuess;
$('setup').addEventListener('click', e => { if (e.target === $('setup') && G) $('setup').classList.add('hidden'); });

buildSetup();
buildWorld(cfg.n);
resize();
requestAnimationFrame(frame);

// 디버그/테스트용 훅
window.__dvc = {
  get G() { return G; }, cfg, cam, start: (n, mode, start, demo) => { cfg.n = n; cfg.mode = mode || 'ffa'; cfg.start = start || 'auto'; $('chk-demo').checked = !!demo; startGame(); },
  project(x, y, z) { const v = new THREE.Vector3(x, y, z).project(camera); const r = renderer.domElement.getBoundingClientRect(); return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height }; },
  tilePos(id) { const o = tileObjs[id]; return o ? this.project(o.g.position.x, o.g.position.y, o.g.position.z) : null; },
  slotPos(idx) { const s = slotMarks.find(m => m.mesh.userData.idx === idx); return s ? this.project(s.mesh.position.x, s.mesh.position.y, s.mesh.position.z) : null; },
  deckPos(c) { const d = deckObjs[c]; return this.project(d.mesh.position.x, d.mesh.position.y + 0.3, d.mesh.position.z); },
  slotCount: () => slotMarks.length,
  dispatchSync: sync
};
})();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>다빈치 코드 3D 테이블</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* 레이아웃: 전체 화면 3D 테이블 + 가장자리에 얹힌 HUD(상단 바, 하단 독, 중앙 모달). 실제 사이트의 우드/펠트/골드 팔레트를 그대로 사용 */
:root {
  --felt: #0b5e3f;
  --felt-dark: #063d29;
  --wood-dark: #2b1810;
  --wood: #5c3319;
  --wood-light: #8a5a2e;
  --gold: #d4af37;
  --gold-light: #f0d78c;
  --parchment: #f2e8d0;
  --ink: #2b1810;
  --ruby: #c0392b;
  --sapphire: #3b82d6;
  --emerald: #2ea866;
  --panel: rgba(28, 15, 8, 0.86);
  --panel-line: rgba(212, 175, 55, 0.55);
  --font-display: 'Cinzel', 'Noto Serif KR', serif;
  --font-body: 'Nunito', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(ellipse at 50% 30%, #6b4226 0%, #3a2112 55%, #1c0f08 100%);
  color: var(--gold-light);
  font-family: var(--font-body);
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.plabel {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
  padding: 3px 10px; border-radius: 999px; white-space: nowrap;
  background: rgba(28,15,8,.82); border: 1.5px solid rgba(212,175,55,.35);
  font-size: 12px; font-weight: 700; line-height: 1.35; text-align: center;
  display: flex; gap: 6px; align-items: center;
}
.plabel.turn { border-color: var(--gold); box-shadow: 0 0 14px rgba(240,215,140,.75); color: #fff; }
.plabel.dead { opacity: .55; text-decoration: line-through; }
.plabel .tag { font-size: 10px; padding: 0 5px; border-radius: 6px; background: rgba(255,255,255,.12); }
.plabel .tA { color: var(--sapphire); } .plabel .tB { color: #ec6a5c; }
.plabel .cnt { font-weight: 600; color: #cdbb86; font-size: 11px; }
.dlabel {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
  font-size: 12px; font-weight: 800; padding: 1px 8px; border-radius: 8px;
  border: 1.5px solid var(--gold); background: rgba(28,15,8,.85);
}

#topbar {
  position: absolute; left: 0; right: 0; top: 0;
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-left, 0px)) 8px max(12px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 8px; pointer-events: none;
}
#topbar > * { pointer-events: auto; }
#topbar h1 {
  font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: 1px; margin: 0; padding: 5px 12px;
  background: linear-gradient(180deg,#3d2110,#1c0f08); border: 2px solid var(--gold); border-radius: 10px;
  color: var(--gold-light); white-space: nowrap;
}
#turninfo { flex: 1; min-width: 0; text-align: center; font-size: 12px; font-weight: 700; color: var(--gold-light); pointer-events: none; text-shadow: 0 1px 3px #000; }
.btn {
  font-family: inherit; font-weight: 800; font-size: 13px; cursor: pointer;
  color: var(--gold-light); background: linear-gradient(180deg,#6b4226,#3a2112);
  border: 1.5px solid var(--gold); border-radius: 10px; padding: 8px 14px; min-height: 38px;
}
.btn:hover:not(:disabled) { filter: brightness(1.15); }
.btn:focus-visible, .chip input:focus-visible + span { outline: 2px solid var(--gold-light); outline-offset: 2px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.small { padding: 6px 10px; min-height: 32px; font-size: 12px; }
.btn.on { background: linear-gradient(180deg,#2ea866,#14653a); color: #fff; }
.btn.primary { background: linear-gradient(180deg,#e9c558,#a67c14); color: var(--ink); }
.btn.black { background: linear-gradient(180deg,#34343a,#0e0e11); color: #fff; }
.btn.white { background: linear-gradient(180deg,#fffdf4,#d9cfb4); color: var(--ink); }

#dock {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 8px max(12px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
#dock > * { pointer-events: auto; }
#status { max-width: 640px; text-align: center; font-weight: 700; font-size: 14px; padding: 7px 14px; border-radius: 12px; background: var(--panel); border: 1.5px solid var(--panel-line); }
#actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
#preview { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; }
.mini { width: 30px; height: 42px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font: 800 18px var(--font-display); border: 2px solid #777; }
.mini.black { background: #17171a; color: #fff; border-color: #55555c; }
.mini.white { background: #f2ede0; color: #17171a; border-color: #b8ae92; }

#logbox {
  position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: calc(54px + env(safe-area-inset-top, 0px));
  width: min(300px, 46vw); max-height: 30vh; overflow: hidden;
  font-size: 11px; line-height: 1.45; color: #d9c98f; pointer-events: none;
}
#logbox div { padding: 1px 0; opacity: .8; text-shadow: 0 1px 2px #000; }
#logbox div:last-child { opacity: 1; color: #fff; }

#toast {
  position: absolute; left: 50%; top: calc(56px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -8px);
  max-width: min(520px, 92vw); padding: 8px 16px; border-radius: 12px; text-align: center; font-weight: 800; font-size: 14px;
  background: rgba(20,10,5,.92); border: 2px solid var(--gold); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.bad { border-color: var(--ruby); } #toast.good { border-color: var(--emerald); }

.overlay { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(15,8,4,.55); padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.card { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: linear-gradient(180deg,#3d2110,#1c0f08); border: 2px solid var(--gold); border-radius: 16px; padding: 18px 20px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
.card h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 4px; letter-spacing: 1px; }
.card p.sub { margin: 0 0 12px; font-size: 12px; color: #cdbb86; }
.group { margin: 12px 0; }
.group > label.t { display: block; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: #cdbb86; margin-bottom: 6px; text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chip span { display: block; padding: 8px 14px; min-width: 44px; text-align: center; border-radius: 10px; font-weight: 800; font-size: 13px; background: rgba(255,255,255,.07); border: 1.5px solid rgba(212,175,55,.3); }
.chip input:checked + span { background: linear-gradient(180deg,#e9c558,#a67c14); color: var(--ink); border-color: var(--gold-light); }
.chip input:disabled + span { opacity: .3; }
.chip input:disabled { cursor: not-allowed; }
.note { font-size: 11px; color: #b9a76d; margin-top: 5px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.row .btn { flex: 1 1 140px; }
#numgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 10px 0; }
#numgrid .btn { padding: 10px 0; font-size: 16px; font-family: var(--font-display); }
#simout { margin-top: 12px; font-size: 11px; overflow-x: auto; }
#simout table { border-collapse: collapse; min-width: 100%; font-variant-numeric: tabular-nums; }
#simout th, #simout td { padding: 3px 8px; border-bottom: 1px solid rgba(212,175,55,.2); text-align: right; white-space: nowrap; }
#simout th:first-child, #simout td:first-child { text-align: left; }
#simout .ok { color: #6fdc9a; } #simout .ng { color: #ff8b7e; font-weight: 800; }
@media (max-width: 520px) {
  #topbar h1 { font-size: 12px; padding: 4px 8px; }
  #turninfo { display: none; }
  #topbar .spacer { flex: 1; }
  .plabel { font-size: 10px; padding: 2px 7px; gap: 4px; }
  #status { font-size: 12px; }
  #logbox { display: none; }
  .card { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="labels"></div>

  <div id="topbar">
    <h1>DA VINCI CODE 3D</h1>
    <div id="turninfo"></div>
    <span class="spacer"></span>
    <button class="btn small" id="btn-auto" type="button" title="내 차례를 AI가 대신 진행합니다">AI 대리</button>
    <button class="btn small" id="btn-reset-cam" type="button">시점 초기화</button>
    <button class="btn small" id="btn-setup" type="button">설정</button>
  </div>
  <div id="logbox"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <div id="dock">
    <div id="preview" hidden></div>
    <div id="status"></div>
    <div id="actions">
      <button class="btn black" id="btn-draw-b" type="button">검은 타일 뽑기</button>
      <button class="btn white" id="btn-draw-w" type="button">흰 타일 뽑기</button>
      <button class="btn primary" id="btn-pass" type="button">턴 넘기기</button>
    </div>
  </div>

  <div class="overlay" id="setup">
    <div class="card">
      <h2>다빈치 코드 3D 테이블</h2>
      <p class="sub">2~6인 프로토타입 · 나는 아래쪽 좌석, 나머지는 AI가 앉습니다. 드래그로 시점 회전, 휠/핀치로 확대.</p>
      <div class="group"><label class="t">인원</label>
        <div class="chips" id="g-n"></div></div>
      <div class="group"><label class="t">게임 모드</label>
        <div class="chips" id="g-mode"></div>
        <div class="note">2:2 팀전은 실제 사이트와 동일하게 4인 전용입니다.</div></div>
      <div class="group"><label class="t">시작 타일 수</label>
        <div class="chips" id="g-tiles"></div>
        <div class="note" id="tiles-note"></div></div>
      <div class="group"><label class="t">AI 속도</label>
        <div class="chips" id="g-speed"></div></div>
      <div class="row">
        <button class="btn primary" id="btn-start" type="button">게임 시작</button>
        <button class="btn" id="btn-sim" type="button">시뮬레이션 검증 실행</button>
        <button class="btn" id="btn-close-setup" type="button" hidden>닫기</button>
      </div>
      <div id="simout" aria-live="polite"></div>
    </div>
  </div>

  <div class="overlay" id="guess" hidden>
    <div class="card" style="width:min(380px,100%)">
      <h2 id="guess-title">숫자 추리</h2>
      <p class="sub" id="guess-sub"></p>
      <div id="numgrid"></div>
      <button class="btn" id="btn-guess-cancel" type="button" style="width:100%">취소</button>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="card" style="width:min(420px,100%); text-align:center">
      <h2 id="over-title">게임 종료</h2>
      <p class="sub" id="over-sub"></p>
      <div class="row">
        <button class="btn primary" id="btn-again" type="button">같은 설정으로 다시</button>
        <button class="btn" id="btn-over-view" type="button">테이블 보기</button>
        <button class="btn" id="btn-over-setup" type="button">설정</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
 *  1) 게임 엔진 (렌더링과 무관한 순수 로직) — 실제 index.html 규칙을 2~6인으로 그대로 옮김
 *   - 검은/흰 타일 각 0~11 + 조커(-) = 26장, 색깔별 덱에서 직접 선택해 뽑기
 *   - 시작 타일 수: 자동(2~4인 4장 / 5~6인 3장), 3, 4, 5장. 시작 타일도 직접 배치
 *   - 정렬 규칙: 왼쪽이 작고 오른쪽이 큼, 같은 숫자는 검은색이 왼쪽, 조커는 어디든 가능
 *   - 최소 1회 정답을 맞혀야 턴 종료 가능, 오답이면 방금 뽑은 타일 공개 + 턴 종료
 *   - 개인전 2~6인 / 2:2 팀전(4인 전용, 팀원 타일은 서로 보임)
 * ===================================================================== */
const DV = (() => {
  const isJ = t => t.num === -1;
  const tid = (c, n) => c[0] + '_' + (n === -1 ? 'J' : n);
  const NAMES = ['나', '다빈치', '모나', '리사', '체사레', '살라이'];

  function mulberry(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(a, rnd) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function orderOK(h) {
    let prev = null;
    for (const t of h) {
      if (isJ(t)) continue;
      if (prev) {
        if (prev.num > t.num) return false;
        if (prev.num === t.num && prev.color === 'white' && t.color === 'black') return false;
      }
      prev = t;
    }
    return true;
  }
  function validSlots(hand, tile) {
    const out = [];
    for (let i = 0; i <= hand.length; i++) { const h = hand.slice(); h.splice(i, 0, tile); if (orderOK(h)) out.push(i); }
    return out;
  }
  const hiddenCount = p => p.hand.filter(t => !t.revealed).length;
  const isAlive = p => !(p.hand.length > 0 && p.hand.every(t => t.revealed));

  function startCountFor(n, setting) {
    if (setting === '3') return 3; if (setting === '4') return 4; if (setting === '5') return 5;
    return n >= 5 ? 3 : 4;
  }
  function maxStart(n) { return n >= 6 ? 4 : 5; } // 6인×5장=30 > 26장이라 6인은 최대 4장

  function log(s, msg) { s.log.push(msg); s.seq++; }

  function newGame(o) {
    const n = o.n, mode = o.mode || 'solo', rnd = o.rnd || Math.random;
    if (n < 2 || n > 6) throw new Error('인원은 2~6명');
    if (mode === 'team' && n !== 4) throw new Error('팀전은 4인 전용');
    const setting = o.tileSetting || 'auto';
    const sc = startCountFor(n, setting);
    if (sc > maxStart(n)) throw new Error('이 인원에서는 시작 타일 ' + sc + '장을 줄 수 없음');

    const black = [], white = [];
    for (let i = 0; i <= 11; i++) {
      black.push({ id: tid('black', i), color: 'black', num: i, revealed: false });
      white.push({ id: tid('white', i), color: 'white', num: i, revealed: false });
    }
    black.push({ id: tid('black', -1), color: 'black', num: -1, revealed: false });
    white.push({ id: tid('white', -1), color: 'white', num: -1, revealed: false });
    shuffle(black, rnd); shuffle(white, rnd);

    const players = [];
    for (let i = 0; i < n; i++) {
      players.push({ id: i, name: NAMES[i], team: mode === 'team' ? (i % 2 === 0 ? 'A' : 'B') : null, bot: i !== (o.humanSeat === undefined ? 0 : o.humanSeat), hand: [], pool: [], pending: null });
    }
    const s = { n, mode, setting, startCount: sc, players, decks: { black, white }, turn: 0, phase: 'init', guessedOK: false, drawnId: null, over: false, winners: [], winText: '', log: [], seq: 0, steps: 0, rnd };
    // 시작 타일 분배 (사이트와 동일: 색은 50% 확률로 고르되 덱이 비면 반대 덱)
    players.forEach(p => {
      const got = [];
      for (let k = 0; k < sc; k++) {
        const pool = (black.length > 0 && rnd() < 0.5) ? black : (white.length > 0 ? white : black);
        if (pool.length > 0) got.push(pool.pop());
      }
      p.hand = [got.shift()];
      p.pool = got;
      p.pending = p.pool.shift() || null;
    });
    log(s, '게임이 시작되었습니다! 처음 받은 타일들을 원하는 위치에 배치하세요.');
    maybeFinishInit(s);
    return s;
  }

  function maybeFinishInit(s) {
    if (s.phase !== 'init') return;
    if (s.players.some(p => p.pending)) return;
    s.turn = 0; startTurn(s);
  }

  function startTurn(s) {
    s.guessedOK = false; s.drawnId = null;
    const me = s.players[s.turn];
    me.pending = null;
    s.phase = (s.decks.black.length + s.decks.white.length > 0) ? 'draw' : 'guess';
    log(s, `${me.name} 님의 차례`);
  }

  function placeTile(s, pi, idx) {
    const p = s.players[pi];
    if (!p.pending) throw new Error('배치할 타일이 없음');
    if (s.phase !== 'init' && !(s.phase === 'place' && s.turn === pi)) throw new Error('지금은 배치할 수 없음');
    if (!validSlots(p.hand, p.pending).includes(idx)) throw new Error('배치 오류: 숫자는 왼쪽이 작고 오른쪽이 커야 하며, 같은 숫자는 검은색이 왼쪽');
    p.hand.splice(idx, 0, p.pending);
    s.steps++;
    if (s.phase === 'init') {
      p.pending = p.pool.shift() || null;
      if (!p.pending) log(s, `${p.name} 님이 시작 타일 배치를 마쳤습니다.`);
      maybeFinishInit(s);
    } else {
      p.pending = null;
      s.phase = 'guess';
      log(s, `${p.name} 님이 뽑은 타일을 배치했습니다.`);
    }
  }

  function draw(s, color) {
    if (s.phase !== 'draw') throw new Error('지금은 뽑을 수 없음');
    const deck = s.decks[color];
    if (!deck || deck.length === 0) throw new Error('해당 색 덱이 비었음');
    const p = s.players[s.turn];
    const t = deck.pop();
    p.pending = t; s.drawnId = t.id; s.phase = 'place'; s.steps++;
    log(s, `${p.name} 님이 [${color === 'black' ? '검은색' : '흰색'}] 타일을 뽑았습니다.`);
  }

  function opponentsOf(s, pi) {
    const me = s.players[pi];
    return s.players.filter(q => q.id !== pi && !(s.mode === 'team' && q.team === me.team));
  }
  function canTarget(s, pi, tpi, idx) {
    const q = s.players[tpi];
    if (!q || tpi === pi) return false;
    if (s.mode === 'team' && q.team === s.players[pi].team) return false;
    const t = q.hand[idx];
    return !!t && !t.revealed;
  }

  function guess(s, tpi, idx, num) {
    if (s.phase !== 'guess' || s.over) throw new Error('지금은 추리할 수 없음');
    const pi = s.turn, me = s.players[pi];
    if (!canTarget(s, pi, tpi, idx)) throw new Error('지목할 수 없는 타일');
    const q = s.players[tpi], t = q.hand[idx];
    const g = num === -1 ? '-' : num;
    s.steps++;
    if (t.num === num) {
      t.revealed = true; s.guessedOK = true;
      log(s, `${me.name} 님이 [${q.name}] 님의 ${idx + 1}번째 타일을 [${g}]로 지목 → 정답`);
      checkWinner(s);

    const out = $('simout'); out.textContent = '시뮬레이션 실행 중...';
    const cfgs = [];
    for (let n = 2; n <= 6; n++) for (const ts of ['auto', '3', '4', '5']) { if (DV.startCountFor(n, ts) > DV.maxStart(n)) continue; cfgs.push({ n, mode: 'solo', tileSetting: ts }); }
    ['auto', '3', '4', '5'].forEach(ts => cfgs.push({ n: 4, mode: 'team', tileSetting: ts }));
    const rows = []; let bad = 0;
    for (const c of cfgs) {
      await new Promise(r => setTimeout(r, 0));
      const r = DV.simulate(Object.assign({ games: 150, seed: 11 }, c)); bad += r.errors.length;
      rows.push(`<tr><td>${c.n}인 ${c.mode === 'team' ? '팀전' : '개인'} · ${c.tileSetting === 'auto' ? '자동' : c.tileSetting + '장'}</td><td>${r.games}</td><td>${r.finished}</td><td>${(r.turns / Math.max(1, r.finished)).toFixed(1)}</td><td>${r.maxHand}</td><td class="${r.errors.length ? 'ng' : 'ok'}">${r.errors.length}</td></tr>`);
    }
    out.innerHTML = `<table><tr><th>설정</th><th>판</th><th>종료</th><th>평균 턴</th><th>최대 패</th><th>오류</th></tr>${rows.join('')}</table><p class="${bad ? 'ng' : 'ok'}">${bad ? '오류 ' + bad + '건' : '전 설정 오류 0건 · 모든 판이 정상 종료'}</p>`;
  };

  /* ---------- 테스트/자동화용 훅 ---------- */
  window.__api = {
    snap: () => { sync3D(); snapAll(); placeCamera(); renderer.render(scene, camera); },
    screenOf(m) { const q = project(m.position.clone()); const r = canvas.getBoundingClientRect(); return { x: r.left + q.x, y: r.top + q.y }; },
    pickables: () => ui.pickables,
    meshOfPick: pred => (ui.pickables || []).find(m => pred(m.userData.pick, m)),
    fast: () => { ui.speed = 0; form.speed = 0; },
    state: () => ui.G && { phase: ui.G.phase, turn: ui.G.turn, over: ui.G.over, guessedOK: ui.G.guessedOK, n: ui.G.n },
    setTime: () => {},
  };

  /* ---------- 부팅 ---------- */
  buildNumGrid(); renderForm(); resize();
  startDemo();
  snapAll(); frame();
})();
</script>
</body>
</html>
